<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24 Kasım Öğretmenler Günün Kutlu Olsun Anneciğim</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at bottom, #1b1429 0%, #090612 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Arka Plan Havai Fişek Canvas'ı */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Ön Plan Tebrik Kartı (Cam Efekti / Glassmorphism) */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 90%;
            max-width: 400px;
            padding: 35px 28px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            color: #fff;
            transition: transform 0.4s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .badge {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-bottom: 18px;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
        }

        h1 {
            font-size: 1.65rem;
            color: #ffd1dc;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(255, 117, 140, 0.3);
        }

        #message {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #f1f1f1;
            min-height: 110px;
            margin-bottom: 22px;
        }

        .quote-author {
            display: block;
            margin-top: 8px;
            font-size: 0.9rem;
            color: #ffd1dc;
            font-style: italic;
        }

        .signature {
            font-style: italic;
            color: #ffb6c1;
            font-size: 0.95rem;
            margin-bottom: 20px;
            opacity: 0;
            transition: opacity 1s ease;
        }

        button {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border: none;
            padding: 13px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.4);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 117, 140, 0.6);
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="card">
        <span class="badge">24 Kasım Öğretmenler Günü</span>
        <h1 id="title">Canım Annem,</h1>
        <p id="message">
            "Öğretmen bir kandile benzer, kendini tüketerek başkalarına ışık verir."
            <span class="quote-author">— Mustafa Kemal Atatürk</span>
        </p>
        <div class="signature" id="signature">❤️ Oğulların Berat ve İbrahim ❤️</div>
        <button id="celebrateBtn">Sürprizi Aç ✨</button>
    </div>

    <script>
        // --- 1. URL PARAMETRESİ VE KİŞİSELLEŞTİRME ---
        const urlParams = new URLSearchParams(window.location.search);
        const customName = urlParams.get('isim');

        const titleEl = document.getElementById('title');
        const messageEl = document.getElementById('message');
        const signatureEl = document.getElementById('signature');
        const btn = document.getElementById('celebrateBtn');

        // Varsayılan olarak Annene özel mesaj, URL'de ?isim= varsa ona göre değişir
        const targetTitle = customName ? `Değerli ${customName} Hocam,` : "Canım Annem,";
        const fullMessage = customName 
            ? "Bilginiz, sabrınız ve yol göstericiliğinizle hayatımıza kattığınız tüm değerler için teşekkür ederim. 24 Kasım Öğretmenler Gününüz kutlu olsun!"
            : "Hem hayatımın ilk ve en büyük öğretmeni olduğun hem de yetiştirdiğin her öğrenciye ışık tuttuğun için seninle gurur duyuyorum. İyi ki benim annemsin, Öğretmenler Günün kutlu olsun!";

        let isOpened = false;
        let autoFireworks = false;

        function typeWriter(text, i = 0) {
            if (i < text.length) {
                messageEl.innerHTML += text.charAt(i);
                setTimeout(() => typeWriter(text, i + 1), 38);
            } else {
                signatureEl.style.opacity = "1";
            }
        }

        // --- 2. HTML5 CANVAS HAVAİ FİŞEK MOTORU ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.012;
                this.gravity = 0.06;
                this.friction = 0.97;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function createFirework(x, y) {
            const colors = ['#ff758c', '#ffd1dc', '#ffd700', '#00f2fe', '#ff9a9e', '#a18cd1'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const particleCount = 65;

            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(9, 6, 18, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (autoFireworks && Math.random() < 0.04) {
                const rx = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
                const ry = Math.random() * canvas.height * 0.5 + canvas.height * 0.1;
                createFirework(rx, ry);
            }

            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                createFirework(e.clientX, e.clientY);
            }
        });

        btn.addEventListener('click', () => {
            createFirework(canvas.width * 0.3, canvas.height * 0.3);
            setTimeout(() => createFirework(canvas.width * 0.7, canvas.height * 0.25), 250);
            setTimeout(() => createFirework(canvas.width * 0.5, canvas.height * 0.2), 500);

            if (!isOpened) {
                isOpened = true;
                autoFireworks = true;
                titleEl.innerText = targetTitle;
                messageEl.innerHTML = "";
                typeWriter(fullMessage);
                btn.innerText = "Havai Fişek Patlat 🎆";
            }
        });
    </script>
</body>
</html>
